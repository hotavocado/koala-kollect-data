name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.10"
      - run: python scripts/check.py
      - run: python -m unittest discover -s ingest -p 'test_*.py' -v
