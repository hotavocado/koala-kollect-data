name: daily-ingest
# Fetch every official card list, ingest it, and commit to main only when a
# record was added, changed or removed (ingest/daily.py says which).
#
# Daily at 04:23 UTC (13:23 JST), off the hour because GitHub delays
# top-of-hour schedules most. Added only after two workflow_dispatch dry runs
# passed on main from GitHub's runners (runs 37814566775 and 37816245391).
#
# GitHub disables a public repo's schedules after 60 days with no repository
# activity. This workflow commits only when the data changes, so a long quiet
# spell can switch it off without a failed run to show for it. The Actions tab
# says so when it happens; re-enable the workflow there.
#
# check.yml will NOT run on the commits this makes: a push made with
# GITHUB_TOKEN does not trigger other workflows. So the gate step below runs
# the same checks (check.py, which includes data_check, and the tests) on the
# written data before anything is committed.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and ingest, but commit nothing and open no issue"
        type: boolean
        default: true
      fake_new_option:
        description: "Control, dry runs only: SITE:SERIES_ID:LABEL added to the new-series check"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    env:
      # A scheduled run has no inputs, so it is never a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      FAKE_NEW_OPTION: ${{ inputs.fake_new_option }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.10"

      - name: Fetch, detect new series, ingest
        id: daily
        working-directory: ingest
        run: |
          args=("$RUNNER_TEMP/pages" "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/daily")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$FAKE_NEW_OPTION" ]; then args+=(--fake-option "$FAKE_NEW_OPTION"); fi
          python daily.py "${args[@]}"

      - name: Gate on the written data
        run: |
          python scripts/check.py
          python -m unittest discover -s ingest -p 'test_*.py'

      - name: Commit
        if: steps.daily.outputs.changed == 'true' && env.DRY_RUN != 'true'
        run: |
          unexpected=$(git status --porcelain --untracked-files=all | grep -v -E '^.. (data/|manifest\.json$|state/|runs/)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::the run wrote outside data/, manifest.json, state/ and runs/:"
            echo "$unexpected"
            exit 1
          fi
          python - "$RUNNER_TEMP/daily/summary.json" > "$RUNNER_TEMP/message.txt" <<'EOF'
          import json, sys, time
          s = json.load(open(sys.argv[1]))
          print(f"Daily ingest {time.strftime('%Y-%m-%d', time.gmtime())}")
          print()
          for site, r in s["sites"].items():
              print(f"{site}: added {r['added']}, changed {r['changed']}, removed {r['removed']}, pages {r['pages_fetched']}")
          print(f"cards: {s['cards']}  cn: {s['cn']}")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add data manifest.json state runs
          git commit -F "$RUNNER_TEMP/message.txt"
          git push origin HEAD:main

      - name: New-series notice
        if: ${{ !cancelled() && steps.daily.outputs.new_series == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(cat "$RUNNER_TEMP/daily/notice_title.txt")
          if [ "$DRY_RUN" = true ]; then
            echo "DRY RUN: would open an issue labelled new-series"
            echo "title: $title"
            cat "$RUNNER_TEMP/daily/notice_body.md"
            exit 0
          fi
          if gh issue list --label new-series --state all --limit 500 --json title --jq '.[].title' | grep -Fxq -- "$title"; then
            echo "already reported: $title"
            exit 0
          fi
          gh label create new-series --color FBCA04 --description "A series the daily ingest has not seen before" --force
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/daily/notice_body.md" --label new-series
